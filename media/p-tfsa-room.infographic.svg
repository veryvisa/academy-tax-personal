<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1035" width="900" height="1035" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">TFSA 取款、直接转移和再供款的三条路</title>
<desc id="d">可能会。自己取出再存，同一年里要用新的额度；取出的金额要到次年 1 月 1 日才回到额度里。想换银行，让两家机构直接转移，就不占额度。</desc>
<rect width="900" height="1035" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">TFSA 额度 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">TFSA 的钱取出来后，马上存回另一家银行会超额吗？</text>
<rect x="40" y="166" width="820" height="143" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">可能会。自己取出再存，同一年里要用新的额度；取出的金额要到次年 1 月 1 日</text>
<text x="64" y="266" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">才回到额度里。想换银行，让两家机构直接转移，就不占额度。</text>
<text x="40" y="360" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">同样从 A 银行挪到 B 银行</text>
<rect x="40.0" y="378" width="261" height="141" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="411" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">① 取出后同年存回</text>
<circle cx="64.0" cy="440" r="3.2" fill="#B42318"/>
<text x="76" y="444" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">算一次取款加一次新供款</text>
<circle cx="64.0" cy="464" r="3.2" fill="#B42318"/>
<text x="76" y="468" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">要有足够的未用额度</text>
<circle cx="64.0" cy="488" r="3.2" fill="#B42318"/>
<text x="76" y="492" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不够就是超额</text>
<rect x="319.3333333333333" y="378" width="261" height="141" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="337" y="411" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">② 取出后次年再存</text>
<circle cx="343.3333333333333" cy="440" r="3.2" fill="#2F5D8A"/>
<text x="355" y="444" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">取出的金额次年 1 月 1 日</text>
<text x="355" y="468" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">恢复成额度</text>
<circle cx="343.3333333333333" cy="488" r="3.2" fill="#2F5D8A"/>
<text x="355" y="492" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">加上当年的新额度一起用</text>
<rect x="598.6666666666666" y="378" width="261" height="141" rx="14" fill="#E8F5EC" stroke="#1E7B34" stroke-width="1.5"/>
<text x="617" y="411" font-size="19" fill="#1E7B34" font-weight="700" text-anchor="start">③ 机构间直接转移</text>
<circle cx="622.6666666666666" cy="440" r="3.2" fill="#1E7B34"/>
<text x="635" y="444" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">由两家机构办理</text>
<circle cx="622.6666666666666" cy="464" r="3.2" fill="#1E7B34"/>
<text x="635" y="468" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不算取款，也不算供款</text>
<circle cx="622.6666666666666" cy="488" r="3.2" fill="#1E7B34"/>
<text x="635" y="492" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">额度不受影响</text>
<text x="40" y="566" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">今年还能存多少</text>
<rect x="40" y="584" width="820" height="124" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="58" y="618" font-size="20" fill="#0E7C7B" font-weight="700" text-anchor="start">可用额度 ＝ 当年新额度 ＋ 以前没用完的额度 ＋ 上一年取出的金额 − 今年已经存入</text>
<text x="58" y="646" font-size="20" fill="#0E7C7B" font-weight="700" text-anchor="start">的金额</text>
<circle cx="64" cy="677" r="3.2" fill="#0E7C7B"/>
<text x="76" y="681" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">要把所有机构的 TFSA 流水加在一起算</text>
<rect x="40" y="734" width="820" height="146" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="768" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="798" r="3.2" fill="#B45309"/>
<text x="76" y="803" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「取出来当天额度就恢复了」：要等次年 1 月 1 日。</text>
<circle cx="64" cy="824" r="3.2" fill="#B45309"/>
<text x="76" y="828" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">只看 CRA 账户里的可用额度：机构次年 2 月底才把交易报给 CRA，那个数往往偏高。</text>
<circle cx="64" cy="849" r="3.2" fill="#B45309"/>
<text x="76" y="854" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">超额的代价：按每月最高超额征 1%，直到取出为止，还要自己申报 RC243。</text>
<line x1="40" y1="906" x2="860" y2="906" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="931" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">官方来源</text>
<text x="40" y="953" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">CRA · Calculate your TFSA contribution room（canada.ca）</text>
<text x="40" y="973" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">CRA · If you over-contribute to a TFSA（canada.ca）</text>
<text x="40" y="999" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">核对日 2026-10-14。年度额度以 CRA 现行页面为准；本图讲通用规则，不判断个案。</text>
</svg>
